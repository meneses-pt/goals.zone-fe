name: Deployment to Production
on:
  push:
    branches: [master]
jobs:
  build:
    name: Deployment Process
    runs-on: ubuntu-latest
    environment: Hetzner
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY_ED25519 }}
        port: ${{ secrets.PORT }}
        script: ./build-fe.sh
